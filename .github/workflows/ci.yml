name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e .[full]

      - name: Import test — core
        run: python -c "import agent_governance; print(f'agent-governance v{agent_governance.__version__}')"

      - name: Import test — all components
        run: |
          python -c "
          from agent_os import StatelessKernel, ExecutionContext
          from agentmesh import TrustManager
          print('Core imports OK')
          "

      - name: Verify version consistency
        run: python -c "import agent_governance; assert agent_governance.__version__, 'Version not set'"
